<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CRIME CITY 3D v3 · 멀티플레이</title>
  <style>
    :root {
      --bg: #1a1c23;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    /* Touch / Mobile Controls Overlay */
    #touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    @media (max-width: 1024px) {
      #touch-controls { display: block; }
    }
    .touch-btn {
      position: absolute;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      backdrop-filter: blur(4px);
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="hud"></canvas>
  <div id="touch-controls">
    <!-- Mobile D-Pad & Action Buttons -->
    <div id="btn-enter" class="touch-btn" style="right: 20px; bottom: 90px; width: 60px; height: 60px;">E</div>
    <div id="btn-fire" class="touch-btn" style="right: 90px; bottom: 30px; width: 70px; height: 70px; background: rgba(255,50,50,0.4);">FIRE</div>
    <div id="btn-dash" class="touch-btn" style="right: 20px; bottom: 160px; width: 50px; height: 50px;">F</div>
    <div id="btn-bullet" class="touch-btn" style="right: 80px; bottom: 160px; width: 50px; height: 50px;">Q</div>
    <div id="btn-jump" class="touch-btn" style="right: 170px; bottom: 40px; width: 58px; height: 58px; background: rgba(80,180,255,0.4);">JUMP</div>
    <div id="btn-map" class="touch-btn" style="right: 20px; bottom: 230px; width: 50px; height: 50px;">MAP</div>
    <div id="btn-grenade" class="touch-btn" style="right: 140px; bottom: 160px; width: 50px; height: 50px;">G</div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  // 모든 플레이어가 같은 도시를 보도록 월드 생성 시 고정 시드 사용
  const __rand = Math.random; { let t = 20260601; Math.random = () => { t |= 0; t = t + 0x6D2B79F5 | 0; let r = Math.imul(t ^ t >>> 15, 1 | t); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

  // ============================================================================
  // AUDIO SYNTHESIZER (Web Audio API)
  // ============================================================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function initAudio() {
    if(!audioCtx) audioCtx = new AudioCtx();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  addEventListener('click', initAudio, {once: true});
  addEventListener('keydown', initAudio, {once: true});

  function playSound(type) {
    if(!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      if(type === 'shoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.12);
      } else if(type === 'crunch') {
        const len = 0.22, buf = audioCtx.createBuffer(1, audioCtx.sampleRate * len, audioCtx.sampleRate), dd = buf.getChannelData(0);
        for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 2);
        const src = audioCtx.createBufferSource(), gain = audioCtx.createGain(), flt = audioCtx.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = 1400; src.buffer = buf; gain.gain.value = 0.35;
        src.connect(flt); flt.connect(gain); gain.connect(audioCtx.destination); src.start(now);
      } else if(type === 'boom') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.4);
      } else if(type === 'cash') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.setValueAtTime(1200, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
      } else if(type === 'siren') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.25);
      }
    } catch(e) {}
  }

  // ============================================================================
  // RENDERER & SCENE SETUP
  // ============================================================================
  const rd = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  rd.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.insertBefore(rd.domElement, document.body.firstChild);

  const sc = new THREE.Scene();
  
  // Skybox Texture
  {
    const c = document.createElement('canvas'); c.width = 2; c.height = 256;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#2f6fb5');
    gr.addColorStop(0.55, '#8ec3f0');
    gr.addColorStop(1, '#f6e7c8');
    g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
    sc.background = new THREE.CanvasTexture(c);
  }
  sc.fog = new THREE.Fog(0xcfe0ee, 300, 1500);

  const cm = new THREE.PerspectiveCamera(65, 1, 1, 1700);

  // Lighting
  sc.add(new THREE.HemisphereLight(0xffffff, 0x556070, 0.95));
  const dl = new THREE.DirectionalLight(0xffffff, 0.7);
  dl.position.set(300, 600, 200);
  sc.add(dl);

  const hud = document.getElementById('hud'), ctx = hud.getContext('2d');
  let VW, VH;
  function rs() {
    VW = hud.width = window.innerWidth;
    VH = hud.height = window.innerHeight;
    rd.setSize(VW, VH);
    cm.aspect = VW / VH;
    cm.updateProjectionMatrix();
  }
  rs();
  window.addEventListener('resize', rs);

  // ============================================================================
  // CITY WORLD GENERATION
  // ============================================================================
  const B = 400, R = 60, N = 40, W = B * N, rnd = (a, b) => a + Math.random() * (b - a);
  const keys = {};

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = 1;
    if (k === 'e' && !MP.rideKey()) toggle();
    if (k === '7' && !e.repeat && P.onFoot && !activeInterior) igniteNearbyBuilding();
    if (k === 't' && !e.repeat && P.onFoot && !P.climb && tnt > 0) throwTNT();
    if (!e.repeat) {
      if (k === 'r' && P.onFoot && rel <= 0 && am[wi] < WP[wi].mag) { rel = WP[wi].rel; msg('장전 중...'); }
      if (P.onFoot && k >= '1' && k <= '6') { wi = +k - 1; rel = 0; scope = false; msg(WP[wi].n); }
      if (k === 'g' && P.onFoot && !P.climb && gren > 0) {
        gren--; heat = Math.min(5, heat + 0.2);
        const gm = new THREE.Mesh(new THREE.SphereGeometry(3.2, 8, 8), M(0x3a5f2a));
        sc.add(gm);
        gr.push({ m: gm, x: P.x + Math.cos(P.a) * 10, y: P.y + Math.sin(P.a) * 10, z: 12 + P.z, vx: Math.cos(P.a) * 280, vy: Math.sin(P.a) * 280, vz: 140, t: 1.6 });
        playSound('shoot');
      }
      if (k === 'f' && P.onFoot && !P.climb && dcd <= 0) { dsh = 0.18; dcd = 2.5; shake = 3; }
      if (k === 'z' && P.onFoot && wi === 5) scope = !scope;
      if (k === 'j' && P.onFoot && P.roof && !P.climb) {
        const b = P.roof, ex = P.x - b.cx, ey = P.y - b.cz;
        if (Math.max(Math.abs(ex), Math.abs(ey)) < 100) msg('옥상 가장자리에서 J로 뛰어내리세요');
        else {
          const ox = Math.abs(ex) > Math.abs(ey) ? Math.sign(ex) : 0, oy = ox ? 0 : Math.sign(ey);
          P.roof = null; P.climb = 2; P.vz = 0; P.fx = ox * 150; P.fy = oy * 150; P.z0 = P.z;
        }
      }
      if (k === 'q') {
        if (slow) slow = false;
        else if (en > 25) { slow = true; msg('불릿타임!'); }
      }
    }
    if (k === ' ' && !e.repeat && P.onFoot && !P.ride && !P.climb && !jk && tased <= 0 && !(P.jh > 0)) { P.jv = MP.jv(); P.jh = 0.01; }
    if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = 0);

  let mdown = 0, aim = 0, aimP = 0;
  window.addEventListener('mousedown', e => { if (e.button === 2) aim = 1; else if (e.button === 0) mdown = 1; });
  window.addEventListener('mouseup', e => { if (e.button === 2) aim = 0; else if (e.button === 0) mdown = 0; });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => { mdown = 0; aim = 0; });

  // Touch Support Bindings
  document.getElementById('btn-jump').addEventListener('touchstart', (e)=>{ e.preventDefault(); if (P.onFoot && !P.ride && !P.climb && !(P.jh > 0) && tased <= 0) { P.jv = MP.jv(); P.jh = 0.01; } });
  document.getElementById('btn-map').addEventListener('touchstart', (e)=>{ e.preventDefault(); window.dispatchEvent(new KeyboardEvent('keydown', { key: 'm' })); });
  document.getElementById('btn-enter').addEventListener('touchstart', (e)=>{ e.preventDefault(); if (!MP.rideKey()) toggle(); });
  document.getElementById('btn-fire').addEventListener('touchstart', (e)=>{ e.preventDefault(); mdown = 1; });
  document.getElementById('btn-fire').addEventListener('touchend', (e)=>{ e.preventDefault(); mdown = 0; });
  document.getElementById('btn-dash').addEventListener('touchstart', (e)=>{ e.preventDefault(); if (P.onFoot && dcd <= 0){ dsh = 0.18; dcd = 2.5; shake = 3; } });
  document.getElementById('btn-bullet').addEventListener('touchstart', (e)=>{ e.preventDefault(); slow = !slow; });
  document.getElementById('btn-grenade').addEventListener('touchstart', (e)=>{ e.preventDefault(); if (P.onFoot && gren > 0){ gren--; const gm = new THREE.Mesh(new THREE.SphereGeometry(3.2, 8, 8), M(0x3a5f2a)); sc.add(gm); gr.push({ m: gm, x: P.x + Math.cos(P.a) * 10, y: P.y + Math.sin(P.a) * 10, z: 12 + P.z, vx: Math.cos(P.a) * 280, vy: Math.sin(P.a) * 280, vz: 140, t: 1.6 }); } });

  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const bx = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

  // Ground & Roads
  const gnd = bx(W + 1200, 1, W + 1200, M(0x4a7a52)); gnd.position.set(W / 2, -0.6, W / 2); sc.add(gnd);
  const roadM = M(0x2a2c32);
  for (let k = 0; k <= N; k++) {
    let r = bx(W, 0.4, 2 * R, roadM); r.position.set(W / 2, 0.1, k * B); sc.add(r);
    r = bx(2 * R, 0.4, W, roadM); r.position.set(k * B, 0.1, W / 2); sc.add(r);
  }
  {
    const nn = 2 * (N + 1) * Math.floor(W / 36), ds = new THREE.InstancedMesh(new THREE.BoxGeometry(18, 0.3, 3), new THREE.MeshBasicMaterial({ color: 0xd8c64a }), nn), o = new THREE.Object3D(); let n = 0;
    for (let k = 0; k <= N; k++) for (let t = 0; t < Math.floor(W / 36); t++) {
      o.rotation.y = 0; o.position.set(t * 36 + 9, 0.4, k * B); o.updateMatrix(); ds.setMatrixAt(n++, o.matrix);
      o.rotation.y = Math.PI / 2; o.position.set(k * B, 0.4, t * 36 + 9); o.updateMatrix(); ds.setMatrixAt(n++, o.matrix);
    }
    sc.add(ds);
  }

  // Building Canvas Textures
  const wc = document.createElement('canvas'); wc.width = wc.height = 64;
  {
    const g = wc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64);
    for (const x of [6, 38]) for (const y of [8, 36]) {
      const lit = Math.random() < 0.3;
      g.fillStyle = lit ? '#ffd98a' : '#2c4764'; g.fillRect(x, y, 20, 20);
      g.fillStyle = lit ? '#fff2c4' : '#5b86ad'; g.fillRect(x + 2, y + 2, 7, 7);
      g.fillStyle = '#e6e9ee'; g.fillRect(x, y + 9, 20, 2);
    }
  }
  const wt = new THREE.CanvasTexture(wc); wt.wrapS = wt.wrapT = THREE.RepeatWrapping;

  const lc = document.createElement('canvas'); lc.width = 16; lc.height = 24;
  {
    const g = lc.getContext('2d'); g.fillStyle = '#c8a063';
    g.fillRect(2, 0, 2, 24); g.fillRect(12, 0, 2, 24); g.fillRect(2, 10, 12, 2);
  }
  const lt = new THREE.CanvasTexture(lc); lt.wrapS = lt.wrapT = THREE.RepeatWrapping;

  let baseP = null, baseSeen = 0;
  let activeInterior = null, tnt = 0, tntCache = null;
  const interiors = [], blocks = [], lads = [], robs = [], lots = [], SWM = M(0x7b808a);
  const jets = [], sees = []; let foam = [];
  const DL = [[], [], []], dc = (t, x, y, z, w, h, d, c, ry) => DL[t].push([x, y, z, w, h, d, c, ry || 0]);
  // 파괴 가능한 공원 소품: fn 안에서 추가된 dc 인스턴스를 하나의 소품으로 묶음
  const props = [], DIM = [];
  function prop(b, x, z, r, kind, fn) {
    const L0 = DL.map(l => l.length); const ex = fn() || [];
    const ids = []; DL.forEach((l, t) => { for (let i = L0[t]; i < l.length; i++) ids.push([t, i]); });
    const pr = { x, z, r, kind, ids, ex, broken: false }; props.push(pr); (b.props || (b.props = [])).push(pr); return pr;
  }

  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const base = i === 10 && j === 10;
    const bank = !base && ((i === 4 && j === 4) || ((i * 7 + j * 3) % 53 === 5));
    const lot = !base && !bank && ((i === 5 && j === 4) || ((i * 5 + j) % 29 === 3 && !(i === 5 && j === 5)));
    const gas = !base && !bank && !lot && !(i === 5 && j === 5) && (i * 3 + j * 7) % 43 === 4;
    const sp = (i === 5 && j === 6) ? 'pol' : (i === 6 && j === 5) ? 'fire' : (i === 6 && j === 6) ? 'mcd' : (i * 11 + j * 5) % 71 === 2 ? 'hos' : (i * 13 + j * 3) % 67 === 7 ? 'pol' : (i * 2 + j * 9) % 59 === 6 ? 'chu' : (i * 7 + j * 2) % 61 === 9 ? 'mall' : 0;
    const lake = !base && !bank && !sp && (i === 14 || i === 15) && (j === 14 || j === 15);
    const pg = !base && !bank && !lot && !gas && !sp && !lake && (i * 4 + j * 7) % 173 === 11;
    const b = { i, j, bank, lot, gas, sp, lake, pg, park: !bank && !lot && !base && !gas && !sp && !lake && !pg && Math.random() < 0.14 && !(i === 5 && j === 5), base };
    blocks.push(b);
    const cx = i * B + B / 2, cz = j * B + B / 2;

    if (!b.lake) { const sw = bx(B - 2 * R, 2, B - 2 * R, SWM); sw.position.set(cx, 1, cz); sc.add(sw); }

    if (b.lake) { b.cx = cx; b.cz = cz; }
    else if (b.base) { b.cx = cx; b.cz = cz; mkBase(cx, cz); }
    else if (b.bank) { mkBank(cx, cz); }
    else if (b.lot) { b.cx = cx; b.cz = cz; mkLot(b); }
    else if (b.gas) { mkGas(cx, cz); }
    else if (b.pg) mkPlay(cx, cz);
    else if (b.park) mkPark(cx, cz, b);
    else {
      const bw = B - 2 * R - 20, h = (i === 5 && j === 5) ? 130 : b.sp ? { hos: 105, pol: 75, chu: 60, mall: 48, fire: 62, mcd: 38 }[b.sp] : rnd(50, 230);
      const col = b.sp ? new THREE.Color({ hos: 0xeef2f5, pol: 0x5a7fb8, chu: 0xcdb89a, mall: 0xd9a066, fire: 0xb83b32, mcd: 0xe8b62f }[b.sp]) : h > 150 && Math.random() < 0.5 ? new THREE.Color(0x5aa0c8) : new THREE.Color().setHSL(rnd(0.55, 0.7), 0.14, rnd(0.35, 0.55));
      const t = wt.clone(); t.needsUpdate = true; t.repeat.set(4, Math.round(h / 28));
      const s = new THREE.MeshLambertMaterial({ color: col, map: t }), rf = M(col.clone().multiplyScalar(0.7));
      const m = new THREE.Mesh(new THREE.BoxGeometry(bw, h, bw), [s, s, rf, rf, s, s]); m.position.set(cx, h / 2 + 2, cz); sc.add(m);
      b.h = h + 2; b.cx = cx; b.cz = cz; b.shell = m; deco(b, bw, h); mkLadder(b); if (['pol','fire','mcd'].includes(b.sp)) makeInterior(b);
    }
  }
  mkLake(); mkBeach();

  // Instanced Details Pipeline
  {
    const gs = [new THREE.BoxGeometry(1, 1, 1), new THREE.CylinderGeometry(0.5, 0.5, 1, 10), new THREE.ConeGeometry(0.5, 1, 4)], o = new THREE.Object3D(), cc = new THREE.Color();
    DL.forEach((l, t) => {
      if (!l.length) return;
      const im = new THREE.InstancedMesh(gs[t], new THREE.MeshLambertMaterial({ color: 0xffffff }), l.length); im.frustumCulled = false; DIM[t] = im;
      l.forEach((e, n) => {
        o.position.set(e[0], e[1], e[2]); o.scale.set(e[3], e[4], e[5]); o.rotation.y = e[7]; o.updateMatrix();
        im.setMatrixAt(n, o.matrix); im.setColorAt(n, cc.set(e[6]));
      });
      sc.add(im);
    });
  }

  // Street Lamps
  {
    const n0 = (N + 1) * (N + 1) * 4, lp = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.9, 0.9, 26, 6), M(0x30343a), n0), lh = new THREE.InstancedMesh(new THREE.SphereGeometry(2.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff0b0 }), n0), o = new THREE.Object3D(); let n = 0;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) for (const [dx, dz] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
      o.position.set(i * B + dx * (R + 4), 13, j * B + dz * (R + 4)); o.updateMatrix(); lp.setMatrixAt(n, o.matrix);
      o.position.y = 26; o.updateMatrix(); lh.setMatrixAt(n, o.matrix); n++;
    }
    sc.add(lp, lh);
    window.streetLampMeshes = [lp, lh];
  }

  // Roof AC Units & Antennas
  {
    const ac = new THREE.InstancedMesh(new THREE.BoxGeometry(14, 6, 10), M(0x8a8f96), blocks.length), an = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.8, 0.8, 30, 5), M(0xbb3333), blocks.length), o = new THREE.Object3D(); let n = 0;
    for (const b of blocks) if (b.h) {
      o.position.set(b.cx + rnd(-80, -30), b.h + 3, b.cz + rnd(-80, 80)); o.updateMatrix(); ac.setMatrixAt(n, o.matrix);
      o.position.set(b.cx + rnd(30, 90), b.h + 15, b.cz + rnd(-80, 80)); o.updateMatrix(); an.setMatrixAt(n, o.matrix); n++;
    }
    ac.count = an.count = n; sc.add(ac, an);
  }

  // Low Sky Clouds
  for (let i = 0; i < 280; i++) {
    const c = bx(rnd(80, 200), rnd(10, 20), rnd(60, 120), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, fog: false }));
    c.position.set(rnd(0, W), rnd(380, 520), rnd(0, W)); sc.add(c);
  }

  const bAt = (x, y) => { const i = Math.floor(x / B), j = Math.floor(y / B); return i < 0 || j < 0 || i >= N || j >= N ? null : blocks[i * N + j]; };

  function mkBase(cx, cz) {
    baseP = { x: cx, y: cz };
    const sl = bx(264, 1.2, 264, M(0x5b5f57)); sl.position.set(cx, 1.6, cz); sc.add(sl);
    const fm = M(0x3d4a2f);
    for (const sg of [-1, 1]) for (const o of [-1, 1]) {
      let f = bx(105, 10, 2, fm); f.position.set(cx + o * 79.5, 7, cz + sg * 129); sc.add(f);
      f = bx(2, 10, 105, fm); f.position.set(cx + sg * 129, 7, cz + o * 79.5); sc.add(f);
    }
    const cb = bx(40, 20, 30, M(0x777b73)); cb.position.set(cx, 12, cz); sc.add(cb);
    const rf = bx(44, 2, 34, M(0x4a4d47)); rf.position.set(cx, 23, cz); sc.add(rf);

  function update(dt) {

        if (r.aura) { r.aura.visible = r.gd; r.aura.position.set(r.x, r.z + (r.onFoot ? 10 : 8), r.y); r.aura.scale.setScalar((r.onFoot ? 1 : 2) * (1 + Math.sin(T * 6) * 0.06)); }
        if (show) { r.walk += dt * Math.min(spd, 220) * 0.08; const s = Math.sin(r.walk) * 0.6; r.mesh.userData.legs[0].rotation.z = s; r.mesh.userData.legs[1].rotation.z = -s; }
        const rc = npcDrive(r);
        if (r.carMesh) { r.carMesh.visible = !r.onFoot && !rc; r.carMesh.position.set(r.x, r.z, r.y); r.carMesh.rotation.y = -r.a; if (r.carMesh.userData.rot) r.carMesh.userData.rot.rotation.y += dt * 35; }
        let th = r.onFoot ? 22 : r.kind === 'heli' ? 40 : 34, tx = r.x, ty = r.y, tz = r.z;
        const myVeh = ride || (!P.onFoot ? myId : null), rv = r.rd || (!r.onFoot ? r.id : null);
        if (r.rd) {
          const dr = remotes.get(r.rd), seat = [...remotes.values()].filter(o => o.rd === r.rd).map(o => o.id).sort().indexOf(r.id);
          const base = dr ? dr : r.rd === myId ? { x: P.car ? P.car.x : P.x, y: P.car ? P.car.y : P.y, z: P.car ? (P.car.z || 0) : 0, kind: P.car && P.car.kind } : r;
          tx = base.x; ty = base.y; tz = base.z || 0; th = (base.kind === 'heli' ? 40 : 34) + 10 * (seat + 1);
        }
        r.tag.visible = !(myVeh && rv === myVeh);
        r.tag.position.set(tx, tz + th, ty);
        const sc2 = Math.max(1, Math.hypot(tx - P.x, ty - P.y) / 260), ts = r.rd ? 0.8 : 1; r.tag.scale.set(32 * sc2 * ts, 8 * sc2 * ts, 1);
        if (r.emo) { r.emoT -= dt; r.emo.visible = r.emoT > 0; r.emo.position.set(r.x, r.z + th + 12, r.y); }
      }
      emoteT -= dt; myEmo.visible = emoteT > 0; myEmo.position.set(P.onFoot ? P.x : P.car.x, (P.onFoot ? P.z + (P.jh || 0) : (P.car.z || 0)) + 30, P.onFoot ? P.y : P.car.y);
      // 친구 경찰(고스트) 보간
      for (const [key, g] of ghosts) {
        if (now - g.seen > 4000) { sc.remove(g.m); ghosts.delete(key); continue; }
        const k = Math.min(1, dt * 8);
        if (Math.hypot(g.tx - g.x, g.ty - g.y) > 300) { g.x = g.tx; g.y = g.ty; } else { g.x += (g.tx - g.x) * k; g.y += (g.ty - g.y) * k; }
        g.z += ((g.tz || 0) - (g.z || 0)) * k; g.a += angN(g.ta - g.a) * k;
        g.m.position.set(g.x, g.z || 0, g.y); g.m.rotation.y = -g.a; g.m.rotation.z = g.t === 'o' && g.dead ? Math.PI / 2 : 0;
        if (g.m.userData.rot) g.m.userData.rot.rotation.y += dt * 35;
        if (g.m.userData.l1) { const f = Math.floor(T * 8) % 2; g.m.userData.l1.material.color.set(f ? 0xff2222 : 0x2244ff); g.m.userData.l2.material.color.set(f ? 0x2244ff : 0xff2222); }
      }
      // 원격 총알
      for (let i = rbul.length - 1; i >= 0; i--) {
        const b = rbul[i]; b.t -= dt; b.x += b.dx * b.v * dt; b.y += b.dy * b.v * dt; b.m.position.set(b.x, b.z, b.y);
        if (b.t <= 0 || solid(b.x, b.y, 1)) { sc.remove(b.m); rbul.splice(i, 1); }
      }
      for (const f of feed) f.life -= dt;
      hbT -= dt; if (hbT <= 0) { hbT = 0.1; updHotbar(); }
      saveT -= dt; if (saveT <= 0) { saveT = 3; LS.set('cc_money', String(money)); }
      shopTick(dt);
      npcTick(dt);
    }
    function hud() {
      ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 4; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = 'bold 15px system-ui';
      let y = VH - (VW <= 1024 ? 250 : 330);
      for (const f of feed) if (f.life > 0) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.c; ctx.fillText(f.t, 16, y); y += 21; }
      ctx.globalAlpha = 1;
      // 동승 정보
      const pas = [...remotes.values()].filter(r => r.rd === myId);
      ctx.textAlign = 'center'; ctx.font = 'bold 15px system-ui';
      if (pas.length && !P.onFoot) { ctx.fillStyle = '#7bd44a'; ctx.fillText('🧑‍🤝‍🧑 동승자: ' + pas.map(r => r.name).join(', '), VW / 2, 54); }
      if (ride) { const r = remotes.get(ride); ctx.fillStyle = '#7bd44a'; ctx.fillText(`🚗 ${r ? r.name : ''} 님 차에 동승 중 · E 하차`, VW / 2, 54); }
      else if (P.onFoot && !P.climb) {
        const nr = [...remotes.values()].find(r => !r.onFoot && !r.rd && Math.hypot(r.x - P.x, r.y - P.y) < 48);
        if (nr) { ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.fillText(`[E] ${nr.name} 님 차에 동승`, VW / 2, VH / 2 + 50); }
        const cz = robs.find(r => r.k === 'c' && Math.hypot(P.x - r.x, P.y - r.y) < 70);
        if (cz) { ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 16px system-ui'; ctx.fillText('[Y] 슬롯머신 $500', VW / 2, VH / 2 + 108); }
      }
      if (locked) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '12px system-ui'; ctx.fillText('🖱 마우스 모드 (P 해제)', VW / 2, 80); }
      ctx.restore();
      drawBuffs();
      if (board) drawBoard();
      if (mapOpen) drawMap();
    }
    function drawBoard() {
      const rows = [{ name: myName, color: myColor, money: Math.round(money), heat: Math.ceil(heat), me: 1, st: P.onFoot ? (ride ? '동승' : '도보') : '운전' }];
      for (const r of remotes.values()) rows.push({ name: r.name, color: r.color, money: r.money || 0, heat: r.heat || 0, st: r.rd ? '동승' : r.onFoot ? '도보' : '운전' });
      rows.sort((a, b) => b.money - a.money);
      const w = 460, rh = 38, h = 64 + rows.length * rh, x = (VW - w) / 2, y = Math.max(60, (VH - h) / 2 - 40);
      ctx.save(); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10,12,18,.88)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 14) : ctx.rect(x, y, w, h); ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,63,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.textBaseline = 'middle'; ctx.font = 'bold 17px system-ui'; ctx.fillStyle = '#ffd23f'; ctx.textAlign = 'left';
      ctx.fillText(`👥 플레이어 ${rows.length}명 · ${room === myCode ? '내 방' : '방 ' + room}`, x + 18, y + 24);
      ctx.font = '12px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.textAlign = 'right'; ctx.fillText('수배  상태  돈', x + w - 18, y + 24);
      rows.forEach((r, i) => {
        const yy = y + 56 + i * rh;
        if (r.me) { ctx.fillStyle = 'rgba(255,210,63,.1)'; ctx.fillRect(x + 8, yy - rh / 2 + 2, w - 16, rh - 4); }
        ctx.fillStyle = hex(r.color); ctx.beginPath(); ctx.arc(x + 26, yy, 7, 0, 7); ctx.fill();
        ctx.textAlign = 'left'; ctx.font = 'bold 16px system-ui'; ctx.fillStyle = hex(r.color);
        ctx.fillText(`${i + 1}. ${r.name}${r.me ? ' (나)' : ''}`, x + 42, yy);
        ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui'; ctx.fillText('$' + r.money.toLocaleString(), x + w - 18, yy);
        ctx.font = '13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(r.st, x + w - 130, yy);
        ctx.fillStyle = '#ffd23f'; ctx.fillText('★'.repeat(Math.min(5, r.heat)) || '-', x + w - 180, yy);
      });
      ctx.restore();
    }
    function mini(ctx2, mx, my, m) {
      ctx2.fillStyle = '#3d7bff'; for (const g of ghosts.values()) ctx2.fillRect(mx + g.x * m - 1.5, my + g.y * m - 1.5, 3, 3);
      for (const r of remotes.values()) { ctx2.fillStyle = hex(r.color); ctx2.beginPath(); ctx2.arc(mx + r.x * m, my + r.y * m, 4, 0, 7); ctx2.fill(); ctx2.strokeStyle = '#000'; ctx2.lineWidth = 1; ctx2.stroke(); }
    }
    function shot(x, y, z, a, col, sz, v) { send('shot', { x: Math.round(x), y: Math.round(y), z: Math.round(z), a: Math.round(a * 1000) / 1000, c: col, s: sz, v }); }
    function boomEv(x, y, r, dmg) { send('boom', { x: Math.round(x), y: Math.round(y), r: Math.round(r), dmg: Math.round(dmg || 100) }); }
    function loot(text, amount) { event(text, { loot: amount, x: Math.round(P.x), y: Math.round(P.y) }); }

    const saved = +LS.get('cc_money'); if (saved > 0) money = saved;
    addFeed(`내 방 코드 ${myCode} — 친구가 이 코드로 참가하면 같이 플레이`, '#ffd23f');
    refreshUI();
    setTimeout(() => go(myCode), 300);
    setInterval(() => { if (lastD && performance.now() - lastForce > 2500) { lastForce = performance.now(); send('s', lastD); } }, 2500);
    return { tick, hud, mini, shot, boom: boomEv, loot, rideKey, bulletHit, martial: martialEv, busted: bustedEv, dbg: () => ({ last: lastD, st: status, host: isHost(), hostId: hostId(), me: myId, rem: [...remotes.values()].map(r => ({ id: r.id, x: r.x | 0, y: r.y | 0, z: r.z | 0, onFoot: r.onFoot, kind: r.kind, nid: r.nid, drv: !!r.drvC, rd: r.rd })) }), locked: () => locked, riding: () => !!ride, aimA, aimVz: (v, z0) => v * aimSl(z0), aimSl, god: () => god > 0, jv: () => jumpT > 0 ? 400 : 230, spd: () => spdT > 0 ? 2 : 1 };
  })();

  let last = performance.now();
  function loop(n) {
    const dt = Math.min(0.05, (n - last) / 1000); last = n;
    if (slow) { en -= 32 * dt; if (en <= 0) { en = 0; slow = false; } } else en = Math.min(100, en + 10 * dt);
    update(dt * (slow ? 0.35 : 1)); MP.tick(dt); render(dt); drawHud(); MP.hud();
    requestAnimationFrame(loop);
  }

  msg('A/D로 돌아서 차 근처에서 E 키!');
  requestAnimationFrame(loop);
  </script>
</body>
