<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wnstj CITY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#12141c;color:#fff;font-family:system-ui,sans-serif}#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12141c;z-index:10}#login .box{background:#1c2030;padding:28px;border-radius:16px;width:min(360px,92vw);text-align:center}input,button{width:100%;padding:12px;border-radius:10px;border:0;margin:7px 0;font-size:16px}button{background:#ff4d6d;color:#fff;font-weight:700;cursor:pointer}#game{display:none;padding:12px}#top{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}#players{font-size:14px;color:#9fd}canvas{background:#20242f;border-radius:12px;display:block;max-width:100%}#chat{position:fixed;left:12px;bottom:12px;width:min(420px,92vw);display:none;gap:8px}#chat input{flex:1}#chat button{width:80px;margin:0}#status{font-size:13px;color:#ffd34d}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>wnstj CITY</h1>
    <input id="nickname" placeholder="닉네임" maxlength="12">
    <input id="roomCode" placeholder="방 코드 (예: ABC123)">
    <button onclick="joinGame()">입장</button>
    <p id="status">닉네임과 방 코드를 입력하세요.</p>
  </div>
</div>
<div id="game">
  <div id="top">
    <strong>방:</strong> <span id="roomLabel"></span>
    <span id="players"></span>
    <button id="readyBtn" onclick="toggleReady()">준비</button>
  </div>
  <canvas id="c" width="900" height="560"></canvas>
  <div id="chat">
    <input id="chatInput" placeholder="채팅 입력">
    <button onclick="sendChat()">전송</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
