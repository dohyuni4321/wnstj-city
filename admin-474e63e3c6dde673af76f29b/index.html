<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>준서시티 관리자</title>
<style>
  :root{--bg:#0f1218;--card:#171b24;--line:#2a3140;--tx:#e8ecf4;--mut:#8b95a8;--acc:#ffd23f;--bad:#ff5a5a;--ok:#4cd98a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#0b0e14;color:var(--tx);font:inherit}
  input:focus{outline:2px solid var(--acc);outline-offset:0}
  button{padding:8px 14px;border-radius:9px;border:0;background:var(--acc);color:#111;font:700 14px inherit;cursor:pointer}
  button.g{background:#2a3140;color:var(--tx)} button.d{background:#3a1c1f;color:#ff8f8f;border:1px solid #6a2a30}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;align-items:center} .row>input{flex:1}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
  .bar .st{color:var(--mut);font-size:13px;flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse} th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--mut);font-size:12px;font-weight:600;position:sticky;top:0;background:var(--card)}
  td.n{font-weight:700;word-break:break-all} td.m{font-variant-numeric:tabular-nums;color:var(--acc);white-space:nowrap} td.t{color:var(--mut);font-size:12px;white-space:nowrap}
  td.a{text-align:right;white-space:nowrap} td.a button{margin-left:6px;padding:6px 10px;font-size:13px}
  .msg{margin-top:10px;min-height:20px;font-size:14px} .msg.e{color:var(--bad)} .msg.o{color:var(--ok)}
  .hide{display:none} .empty{padding:24px;text-align:center;color:var(--mut)}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);padding:18px;width:min(420px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)} dialog h2{margin:0 0 10px;font-size:17px} dialog p{margin:6px 0 12px;color:var(--mut);font-size:14px}
  dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .warn{color:var(--bad)}
  #dEdit{width:min(560px,94vw)} #dEdit label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  .wg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:42vh;overflow:auto;margin-top:6px}
  .wc{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:#0f131b}
  .wc span{flex:1;font-size:13px} .wc input[type=checkbox]{width:auto} .wc select{background:#0b0e14;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:3px 4px}
  .tiny{font-size:12px;color:var(--mut);margin-top:8px}
  @media (max-width:560px){td.t,th.t{display:none} td.a button{display:block;margin:4px 0 0 auto}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 준서시티 관리자</h1>
  <div class="sub">계정 확인 · 이름 · 돈 · 무기 · 무기 강화 수정 · 계정 삭제. 수정하면 접속 중인 사람에게 3초 안에 반영돼요.</div>

  <div class="card hide" id="login"><div class="row"><input id="pwIn" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"><button id="pwGo">로그인</button></div><div class="msg" id="lmsg"></div><div class="sub" style="margin:8px 0 0">처음 한 번만 입력하면 이 기기에 기억돼요.</div></div>
  <div class="card hide" id="panel">
    <div class="row"><input id="q" placeholder="이름 검색"><button class="g" id="reload">새로고침</button><button class="d" id="zero">돈 0원 전부 삭제</button></div>
    <div class="bar"><div class="st" id="stat"></div><label style="font-size:13px;color:var(--mut)"><input type="checkbox" id="sortname" style="width:auto;vertical-align:middle"> 이름순</label></div>
    <div style="overflow:auto;max-height:70vh"><table><thead><tr><th>이름</th><th>돈</th><th class="t">마지막 저장</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<dialog id="dEdit">
  <h2>계정 편집</h2><div class="tiny" id="eInfo"></div>
  <label>이름</label><input id="eName" maxlength="24">
  <label>돈 ($)</label><input id="eMoney" type="number" min="0" step="1">
  <label>무기 · 강화 (기본 무기 0~5번은 항상 보유 · 강화 0~10)</label><div class="wg" id="eW"></div>
  <div class="tiny warn" id="eWarn"></div>
  <div class="btns"><button class="g" data-close>취소</button><button id="eOk">저장</button></div>
</dialog>
<dialog id="dRename">
  <h2>이름 변경</h2><p id="rOld"></p><input id="rNew" maxlength="24" placeholder="새 이름 (1~24자)">
  <div class="btns"><button class="g" data-close>취소</button><button id="rOk">변경</button></div>
</dialog>

<script>
const URL_ = 'https://eyiweluikqptpltdbind.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_2HSCefmudZ2dM39UsDhbjQ_xUdBlTHy';
let PW = ''; try { PW = localStorage.getItem('cc_admin_pw') || ''; } catch (e) {} let data = [], target = '', editName = '', editOwn = {};
const WPN = [[0,'권총',1],[1,'기관단총',1],[2,'산탄총',1],[3,'로켓런처',1],[4,'스턴건',1],[5,'저격총',1],[7,'레일건'],[9,'화염방사기'],[14,'번개총'],[15,'회전톱'],[16,'블랙홀 건'],[18,'텔레포트 건'],[19,'끈끈이 폭탄총'],[20,'👑 천벌 (레전드)']];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function rpc(fn, body) {
  const r = await fetch(URL_ + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
  if (!r.ok) { const m = (j && (j.message || j.hint)) || t || ('HTTP ' + r.status); throw new Error(m); }
  return j;
}
const say = (id, t, cls) => { const e = $(id); e.textContent = t || ''; e.className = 'msg ' + (cls || ''); };
const friendly = e => /wrong password/.test(e.message) ? '비밀번호가 틀렸어요' : /already exists/.test(e.message) ? '이미 있는 이름이에요' : /not found/.test(e.message) ? '그 계정이 없어요 (이미 바뀌었을 수 있어요)' : /length/.test(e.message) ? '이름은 1~24자예요' : '오류: ' + e.message;

async function load() {
  say('msg', '불러오는 중...');
  try { data = await rpc('cc_admin_list', { pw: PW }); say('msg', ''); render(); return true; }
  catch (e) { say('msg', friendly(e), 'e'); return false; }
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  let list = data.filter(d => !q || d.name.toLowerCase().includes(q));
  if ($('sortname').checked) list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const total = data.reduce((s, d) => s + Number(d.money), 0), zeros = data.filter(d => Number(d.money) === 0).length;
  $('stat').textContent = `계정 ${data.length}개 · 표시 ${list.length}개 · 돈 0원 ${zeros}개 · 돈 합계 $${total.toLocaleString()}`;
  $('zero').textContent = `돈 0원 전부 삭제 (${zeros})`; $('zero').disabled = !zeros;
  $('rows').innerHTML = list.length ? list.map(d => `<tr><td class="n">${esc(d.name)}</td><td class="m">$${Number(d.money).toLocaleString()}</td><td class="t">${new Date(d.updated_at).toLocaleString('ko-KR')}</td><td class="a"><button data-e="${esc(d.name)}">편집</button><button class="g" data-r="${esc(d.name)}">이름변경</button><button class="d" data-d="${esc(d.name)}">삭제</button></td></tr>`).join('') : '<tr><td colspan="4" class="empty">계정이 없어요</td></tr>';
}
$('reload').onclick = load; $('q').oninput = render; $('sortname').onchange = render;
$('rows').onclick = e => {
  const r = e.target.dataset.r, d = e.target.dataset.d;
  const ed = e.target.dataset.e; if (ed !== undefined) openEdit(ed);
  if (r !== undefined) { target = r; $('rOld').textContent = '현재 이름: ' + r; $('rNew').value = r; $('dRename').showModal(); $('rNew').select(); }
  if (d !== undefined) { e.target.disabled = true; delAcc(d); }
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('rOk').onclick = async () => {
  const n = $('rNew').value.trim(); if (!n || n === target) { $('dRename').close(); return; }
  $('rOk').disabled = true;
  try { await rpc('cc_admin_rename', { pw: PW, old_name: target, new_name: n }); $('dRename').close(); say('msg', `이름 변경 완료: ${target} → ${n}`, 'o'); await load(); say('msg', `이름 변경 완료: ${target} → ${n}`, 'o'); }
  catch (e) { $('dRename').close(); say('msg', friendly(e), 'e'); }
  $('rOk').disabled = false;
};
async function openEdit(name) {
  say('msg', '불러오는 중...');
  try {
    const rows = await rpc('cc_admin_get', { pw: PW, target: name }); if (!rows || !rows.length) throw new Error('not found');
    const a = rows[0]; editName = name; editOwn = a.own || {}; const wu = editOwn.wu || {};
    $('eInfo').textContent = '현재 계정: ' + name; $('eName').value = name; $('eMoney').value = Number(a.money);
    $('eWarn').textContent = '이름을 바꾸면 접속 중인 사람은 새로고침해야 해요 (그 전까지 저장이 멈춰요).';
    $('eW').innerHTML = WPN.map(([i, n, base]) => `<div class="wc"><input type="checkbox" data-o="${i}" ${base || editOwn[i] ? 'checked' : ''} ${base ? 'disabled' : ''}><span>${n}</span><select data-u="${i}">${Array.from({length:11},(_, l)=>`<option value="${l}" ${(+wu[i]||0)===l?'selected':''}>${l?'+'+l:'강화 없음'}</option>`).join('')}</select></div>`).join('');
    say('msg', ''); $('dEdit').showModal();
  } catch (e) { say('msg', friendly(e), 'e'); }
}
$('eOk').onclick = async () => {
  const money = Math.floor(Number($('eMoney').value)); const nn = $('eName').value.trim();
  if (!(money >= 0) || !Number.isFinite(money)) { $('eWarn').textContent = '돈은 0 이상의 숫자예요'; return; }
  if (!nn) { $('eWarn').textContent = '이름을 입력하세요'; return; }
  $('eOk').disabled = true;
  try {
    const fresh = (await rpc('cc_admin_get', { pw: PW, target: editName }))[0]; const own = fresh.own || {}; own.wu = own.wu || {};
    document.querySelectorAll('#eW [data-o]').forEach(c => { const i = c.dataset.o; if (+i >= 6) { if (c.checked) own[i] = 1; else delete own[i]; } });
    document.querySelectorAll('#eW [data-u]').forEach(c => { const i = c.dataset.u, l = +c.value; if (l > 0) own.wu[i] = l; else delete own.wu[i]; });
    await rpc('cc_admin_set', { pw: PW, target: editName, new_money: money, new_own: own });
    let m = `저장 완료: ${editName} · $${money.toLocaleString()} · 접속 중이면 3초 안에 반영돼요`;
    if (nn !== editName) { await rpc('cc_admin_rename', { pw: PW, old_name: editName, new_name: nn }); m += ` · 이름 ${editName} → ${nn}`; }
    $('dEdit').close(); await load(); say('msg', m, 'o');
  } catch (e) { $('eWarn').textContent = friendly(e); }
  $('eOk').disabled = false;
};
async function delAcc(name) {
  try { await rpc('cc_admin_delete', { pw: PW, target: name }); await load(); say('msg', `삭제 완료: ${name}`, 'o'); }
  catch (e) { say('msg', friendly(e), 'e'); await load(); }
}
$('zero').onclick = async () => {
  const n = data.filter(d => Number(d.money) === 0).length; if (!n) return;
  if (!confirm(`돈 0원 계정 ${n}개를 전부 삭제할까요?`)) return;
  $('zero').disabled = true;
  try { const c = await rpc('cc_admin_delete_zero', { pw: PW }); await load(); say('msg', `돈 0원 계정 ${c}개 삭제 완료`, 'o'); }
  catch (e) { say('msg', friendly(e), 'e'); await load(); }
};
async function tryLogin() {
  const ok = await load();
  if (ok) { try { localStorage.setItem('cc_admin_pw', PW); } catch (e) {} $('login').classList.add('hide'); $('panel').classList.remove('hide'); say('lmsg', ''); }
  else { try { localStorage.removeItem('cc_admin_pw'); } catch (e) {} PW = ''; $('panel').classList.add('hide'); $('login').classList.remove('hide'); say('lmsg', $('msg').textContent || '로그인 실패', 'e'); }
}
$('pwGo').onclick = () => { PW = $('pwIn').value; tryLogin(); };
$('pwIn').addEventListener('keydown', e => { if (e.key === 'Enter') { PW = $('pwIn').value; tryLogin(); } });
if (PW) tryLogin(); else $('login').classList.remove('hide');
</script>
</body>
</html>
